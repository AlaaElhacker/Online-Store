<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Update Product</title>
    <style>
        body {
            font-family: "Segoe UI", Arial, sans-serif;
            background: #e9eef3;
            padding: 40px;
        }

        .box {
            background: #ffffff;
            padding: 30px;
            width: 420px;
            margin: auto;
            border-radius: 16px;
            box-shadow: 0 5px 25px rgba(0,0,0,0.1);
            transition: 0.3s;
        }
        .box:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 30px rgba(0,0,0,0.15);
        }

        h2 {
            text-align: center;
            margin-bottom: 25px;
            color: #333;
            letter-spacing: 0.5px;
        }

        label {
            font-weight: 600;
            color: #444;
        }

        input, select {
            width: 100%;
            padding: 11px;
            margin: 8px 0 15px 0;
            border: 1px solid #d0d0d0;
            border-radius: 8px;
            outline: none;
            transition: 0.2s;
        }

        input:focus, select:focus {
            border-color: #0a7cff;
            box-shadow: 0 0 5px rgba(10,124,255,0.3);
        }

        button {
            width: 100%;
            padding: 12px;
            background: #0a7cff;
            border: none;
            border-radius: 10px;
            color: white;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            transition: 0.25s;
        }

        button:hover {
            background: #006be6;
            transform: scale(1.03);
        }
    </style>
</head>

<body>

<div class="box">
    <h2>Update Product</h2>

    <form action="../php/Product Update.php" method="POST">

        <label>Product ID:</label>
        <input type="number" name="product_id" required>

        <label>Choose Update Type:</label>
        <select name="update_type" required>
            <option value="stock">Update Stock Only</option>
            <option value="price">Update Price Only</option>
            <option value="both">Update Stock + Price</option>
        </select>

        <label>Add to Stock (negative = remove):</label>
        <input type="number" name="stock">

        <label>New Price:</label>
        <input type="number" step="0.01" name="price">

        <button type="submit">Update</button>
    </form>

</div>

</body>
</html>
