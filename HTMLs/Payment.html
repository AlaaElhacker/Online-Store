<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Make Payment</title>
<style>
body { font-family: Arial; background: #f4f6f8; padding: 30px; }
.payment-container { max-width: 400px; margin: auto; background: #fff; padding: 30px; border-radius: 12px; box-shadow: 0 8px 20px rgba(0,0,0,0.1); }
.payment-container h2 { text-align: center; color: #333; }
.payment-container label { display: block; margin-top: 15px; font-weight: bold; }
.payment-container input, .payment-container select { width: 100%; padding: 8px; margin-top: 5px; border-radius: 6px; border: 1px solid #ccc; }
.payment-container button { margin-top: 20px; width: 100%; padding: 10px; background: #4CAF50; color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 16px; }
.payment-container button:hover { background: #45a049; }
</style>
</head>
<body>
<div class="payment-container">
<h2>Make Payment</h2>
<form method="POST" action="../php/Payment.php">
    <label for="order_id">Order ID:</label>
    <input type="number" name="order_id" id="order_id" required>

    <label for="amount">Amount:</label>
    <input type="number" step="0.01" name="amount" id="amount" required>

    <label for="method">Payment Method:</label>
    <select name="method" id="method">
        <option value="Credit Card">Credit Card</option>
        <option value="Cash">Cash</option>
        <option value="PayPal">PayPal</option>
    </select>

    <button type="submit">Pay Now</button>
</form>
</div>
</body>
</html>
