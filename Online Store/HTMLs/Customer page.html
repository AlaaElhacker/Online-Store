<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Customer Dashboard</title>
<style>
    /* Reset بسيط */
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    body {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        background: linear-gradient(135deg, #74ebd5, #ACB6E5);
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
    }

    .dashboard-container {
        background: #fff;
        padding: 50px 40px;
        border-radius: 15px;
        box-shadow: 0 15px 35px rgba(0,0,0,0.2);
        text-align: center;
        width: 360px;
        transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .dashboard-container:hover {
        transform: translateY(-5px);
        box-shadow: 0 20px 40px rgba(0,0,0,0.25);
    }

    .dashboard-container h2 {
        margin-bottom: 35px;
        color: #333;
        font-size: 24px;
        letter-spacing: 1px;
    }

    .btn {
        display: block;
        width: 100%;
        padding: 15px 0;
        margin: 15px 0;
        font-size: 16px;
        font-weight: bold;
        color: white;
        border: none;
        border-radius: 10px;
        cursor: pointer;
        transition: all 0.3s ease;
        text-decoration: none;
        box-shadow: 0 5px 15px rgba(0,0,0,0.1);
    }

    .btn:hover {
        box-shadow: 0 8px 20px rgba(0,0,0,0.2);
    }

    .btn.order {
        background: #4CAF50;
    }

    .btn.order:hover {
        background: #43a047;
    }

    .btn.payment {
        background: #2196F3;
    }

    .btn.payment:hover {
        background: #1976d2;
    }

    .welcome-text {
        font-size: 14px;
        color: #666;
        margin-bottom: 25px;
    }

</style>
</head>
<body>

<div class="dashboard-container">
    <h2>Welcome Back!</h2>
    <div class="welcome-text">Choose an action below to continue</div>
    <a href="makeorder.html" class="btn order">🛒 Make Order</a>
    <a href="Payment.html" class="btn payment">💳 Payment</a>
</div>

</body>
</html>
