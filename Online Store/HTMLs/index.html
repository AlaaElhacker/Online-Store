<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Welcome</title>

<style>
    body {
        margin: 0;
        padding: 0;
        font-family: "Segoe UI", Arial, sans-serif;
        background: linear-gradient(135deg, #ececec, #fafafa);
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
    }
a{
    text-decoration: none;
}
    .container {
        width: 430px;
        background: white;
        padding: 40px 35px;
        border-radius: 18px;
        box-shadow: 0px 12px 35px rgba(0,0,0,0.15);
        text-align: center;
    }

    h1 {
        margin: 0 0 10px;
        font-size: 28px;
        color: #222;
        letter-spacing: 1px;
    }

    .subtitle {
        color: #555;
        margin-bottom: 25px;
        font-size: 15px;
    }

    .section-title {
        font-size: 22px;
        color: #333;
        font-weight: bold;
        margin: 25px 0 15px;
        text-transform: uppercase;
        letter-spacing: 1px;
        text-align: left;
    }

    .btn {
        width: 100%;
        padding: 14px;
        border: none;
        border-radius: 10px;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
        margin-bottom: 15px;
        transition: 0.25s;
        color: white;
    }

    /* Buttons Styling */
    .btn-existing {
        background: #2ecc71;
    }
    .btn-existing:hover {
        background: #27ae60;
    }

    .btn-signup {
        background: #3498db;
    }
    .btn-signup:hover {
        background: #2b7bb8;
    }

    .btn-admin {
        background: #e74c3c;
    }
    .btn-admin:hover {
        background: #c0392b;
    }
</style>

</head>
<body>

<div class="container">

    <h1>WELCOME TO OUR STORE</h1>
    <div class="subtitle">Please select how you want to continue</div>

    <!-- CUSTOMER SECTION -->
    <div class="section-title">Customer: </div>

    <button class="btn btn-existing">
       <a href="../HTMLs/Customer page.html" class="btn">
        Existing Customer
    </a>
    </button>

    <button class="btn btn-signup" >
       <a href="../HTMLs/Customers.html" class="btn">
        Sign Up
    </a> 
    </button>

    <!-- ADMIN SECTION -->
    <div class="section-title" style="margin-top: 10px;">Admin: </div>

    <button class="btn btn-admin" >
         <a href="../HTMLs/Admin.html" class="btn">
        Log In
    </a> 
    </button>

</div>

</body>
</html>
