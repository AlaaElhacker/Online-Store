<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Add Coupon</title>
 <style>
       body {
    background: #f4f4f4;
    font-family: Arial, sans-serif;
}

.form-container {
    width: 380px;
    margin: 60px auto;
    background: #fff;
    padding: 25px;
    border-radius: 12px;
    box-shadow: 0 0 15px rgba(0,0,0,0.1);
}

h2 {
    text-align: center;
    margin-bottom: 20px;
}

label {
    margin-top: 10px;
    display: block;
    font-weight: bold;
}

input, textarea {
    width: 100%;
    padding: 10px;
    margin-top: 5px;
    border-radius: 6px;
    border: 1px solid #aaa;
}

button {
    margin-top: 15px;
    width: 100%;
    padding: 10px;
    background: #3498db;
    color: white;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    font-size: 16px;
}

button:hover {
    background: #217dbb;
}

    </style>
</head>
<body>

<div class="form-container">
    <h2>Add New Coupon</h2>

    <form action="../php/Cobons.php" method="POST">

        <label>Coupon Code</label>
        <input type="text" name="Code" required>

        <label>Discount Type (percentage / fixed)</label>
        <input type="text" name="DiscountType" required>

        <label>Discount Value</label>
        <input type="number" step="0.01" name="DiscountValue" required>

        <label>Valid Until</label>
        <input type="datetime-local" name="ValidUntil" required>

        <button type="submit">Save Coupon</button>
    </form>
</div>

</body>
</html>
