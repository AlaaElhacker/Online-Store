<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SQL Queries Tabs</title>

<style>
    body {
        font-family: Arial;
        background: #f8f8f8;
        padding: 30px;
    }

    .tabs {
        display: flex;
        gap: 10px;
        margin-bottom: 20px;
        flex-wrap: wrap;
    }

    .tab-btn {
        padding: 10px 20px;
        background: #ddd;
        border-radius: 6px;
        cursor: pointer;
        transition: 0.3s;
        border: 1px solid #ccc;
        font-size: 14px;
    }

    .tab-btn.active {
        background: #4CAF50;
        color: white;
        font-weight: bold;
    }
/* 
     .result-box {
        padding: 20px;

        box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }

    table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 15px;
    }

    table th, table td {
        border: 1px solid #ccc;
        padding: 10px;
        font-size: 14px;
        text-align: center;
    }

    table th {
        background: #eee;

    #result-box {
        background: white;
        padding: 20px;
        border-radius: 8px;
        box-shadow: 0px 0px 10px rgba(0,0,0,0.1);
        min-height: 150px;
    }
</style>

</head>
<body>

<h2>Run SQL Queries</h2>

<div class="tabs">
    <div class="tab-btn active" data-id="1">Query 1</div>
    <div class="tab-btn" data-id="2">Query 2</div>
    <div class="tab-btn" data-id="3">Query 3</div>
    <div class="tab-btn" data-id="4">Query 4</div>
    <div class="tab-btn" data-id="5">Query 5</div>
    <div class="tab-btn" data-id="6">Query 6</div>
    <div class="tab-btn" data-id="7">Query 7</div>
    <div class="tab-btn" data-id="8">Query 8</div>
    <div class="tab-btn" data-id="9">Query 9</div>
    <div class="tab-btn" data-id="10">Query 10</div>   
    <div class="tab-btn" data-id="11">Query 11</div>
    <div class="tab-btn" data-id="12">Query 12</div> 
    <div class="tab-btn" data-id="13">Query 13</div>
    
</div>

<div id="result-box">Loading...</div>

<script>
    function loadQuery(id){
        fetch("get_query.php?query=" + id)
            .then(res => res.text())
            .then(data => {
                document.getElementById("result-box").innerHTML = data;
            });
    }

    // أول ما تفتحي الصفحة يشغّل Query 1
    loadQuery(1);

    const btns = document.querySelectorAll('.tab-btn');
    btns.forEach(btn => {
        btn.addEventListener("click", () => {
            btns.forEach(b => b.classList.remove("active"));
            btn.classList.add("active");
            loadQuery(btn.dataset.id);
        });
    });
</script>

</body>
</html>
